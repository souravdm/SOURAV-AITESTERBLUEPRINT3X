# =============================================================================
# Restful Booker API Automation — Runtime Configuration
# =============================================================================
# All values can be overridden by environment variables.
# ENV-var resolution rule: key uppercased, dots→underscores, dashes→underscores
# e.g.  base.uri  →  BASE_URI
#       auth.username  →  AUTH_USERNAME
# =============================================================================

# ── Base URI ──────────────────────────────────────────────────────────────────
# Source: https://restful-booker.herokuapp.com/apidoc/index.html
base.uri=https://restful-booker.herokuapp.com

# ── SLA / Timeouts ───────────────────────────────────────────────────────────
# Maximum acceptable end-to-end response time in milliseconds (REQ-HC-004)
response.time.sla.ms=2000

# HTTP socket / connect timeouts in milliseconds
connection.timeout=10000
read.timeout=10000

# ── Logging ───────────────────────────────────────────────────────────────────
# Emit full request / response detail to Log4j2 (true | false)
log.request=true
log.response=true

# ── Auth Credentials ─────────────────────────────────────────────────────────
# Publicly documented test credentials from the Restful Booker spec.
# Source: https://restful-booker.herokuapp.com/apidoc/index.html#api-Auth-CreateToken
# Override in CI via AUTH_USERNAME / AUTH_PASSWORD env vars — never commit real secrets.
auth.username=admin
auth.password=password123
